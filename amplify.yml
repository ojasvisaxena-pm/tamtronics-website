# AWS Amplify Hosting build spec (platform: WEB_COMPUTE, Next.js SSR).
# Secrets are read from AWS Secrets Manager (APP_SECRET_ID) during the build and written to
# .env.production, which Next.js loads on the server only. See docs/DEPLOYMENT.md > AWS Amplify.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - node --version && npm --version
        - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    build:
      commands:
        - node scripts/amplify-env.mjs
        # The home page is prerendered, so the build connects to MongoDB (see .env.production).
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*
